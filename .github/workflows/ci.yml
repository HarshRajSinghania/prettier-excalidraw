name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests (stdlib only, no dependencies)
        run: python -m unittest discover -s tests -v
      - name: Lint shipped examples
        working-directory: skills/prettier-excalidraw/scripts
        run: |
          for f in ../assets/examples/*.excalidraw; do python lint.py "$f"; done
